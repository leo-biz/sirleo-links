<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text</title>
  <script src="/config.js"></script>
  <script src="/js/shared.js"></script>
  <style>
    body { margin: 0; background: #080808; color: #b4915a; font-family: sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    p { font-size: 14px; opacity: 0.7; margin-top: 8px; }
    a { color: #b4915a; }
  </style>
</head>
<body>
  <div>
    <div style="font-family:'Cinzel',serif;font-size:18px;letter-spacing:0.1em;">Opening messages...</div>
    <p>If it doesn't open, <a href="#" id="manual">tap here</a>.</p>
    <p style="margin-top:24px;"><a href="/">← Back</a></p>
  </div>
  <script>
    const params   = new URLSearchParams(location.search);
    const name     = params.get('name')     || localStorage.getItem('sl_name')     || '';
    const interest = params.get('interest') || localStorage.getItem('sl_interest') || '';
    const event    = params.get('event')    || SL.eventName || '';

    const msg = buildSmsBody(name, interest, event);

    const smsUrl = 'sms:' + SL.phone + '?body=' + encodeURIComponent(msg);
    document.getElementById('manual').href = smsUrl;
    window.location.href = smsUrl;
  </script>
</body>
</html>
