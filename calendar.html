<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add to Calendar</title>
  <script src="/config.js"></script>
  <script src="/js/shared.js"></script>
  <style>
    body { margin: 0; background: #080808; color: #b4915a; font-family: sans-serif;
      display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    p { font-size: 14px; opacity: 0.7; margin-top: 8px; }
    a { color: #b4915a; }
  </style>
</head>
<body>
  <div>
    <div style="font-family:'Cinzel',serif;font-size:18px;letter-spacing:0.1em;">Downloading calendar...</div>
    <p>If it doesn't start, <a href="#" id="manual">tap here</a>.</p>
    <p style="margin-top:24px;"><a href="/">← Back</a></p>
  </div>
  <script>
    function go() {
      const params = new URLSearchParams(location.search);
      const lat = parseFloat(params.get('lat'));
      const lon = parseFloat(params.get('lon'));
      if (!isNaN(lat) && !isNaN(lon)) {
        buildAndDownloadICS(lat, lon);
      } else {
        addToCalendar();
      }
      document.getElementById('manual').onclick = () => { buildAndDownloadICS(null, null); return false; };
    }
    setTimeout(go, 400);
  </script>
</body>
</html>
