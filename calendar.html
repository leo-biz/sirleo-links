<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sir Leo — Add to Calendar</title>
  <style>
    body { margin: 0; background: #080808; color: #b4915a; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; }
    p { font-size: 14px; opacity: 0.7; margin-top: 8px; }
    a { color: #b4915a; }
  </style>
</head>
<body>
  <div>
    <div style="font-family:'Cinzel',serif;font-size:18px;letter-spacing:0.1em;">Downloading calendar...</div>
    <p>If it doesn't start, <a href="#" id="manual">tap here</a>.</p>
    <p style="margin-top:24px;"><a href="/">← Back to Sir Leo</a></p>
  </div>
  <script>
    function buildAndDownload(lat, lon) {
      const pad = n => String(n).padStart(2,'0');
      const fmt = d => d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate());
      const today = new Date();
      const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
      const reminder = new Date(today); reminder.setDate(today.getDate() + 3);
      const reminderEnd = new Date(reminder); reminderEnd.setDate(reminder.getDate() + 1);

      const desc1 = [
        'On this day\\, you experienced the presence of Sir Leo.',
        'Below are your instructions\\, skip steps you have already completed:\\n',
        'Step 1. Visit https://sirleo-links.netlify.app',
        'Step 2. A pop up will appear\\, insert your contact info and complete the checkbox of interest',
        'Step 3. Click Contact > Text Sir Leo. It will auto create a text\\, be sure to press send',
        'Step 4. Recognize\\, Schedule a call is present for future endeavors',
        'Step 5. Click Follow\\, and follow Sir Leo on all social medias listed',
        'Step 6. Click Book\\, and click the options of interest',
        'Step 7. Click Collaborate if you are looking to do so\\n',
        'Sir Leo',
        'Phone: +1 (773) 234-8238',
        'Email: sir.black.leo@gmail.com',
        'Site: https://sirleo-links.netlify.app'
      ].join('\\n');

      const desc2 = [
        'Your reminder to follow through with Sir Leo.\\n',
        'Site: https://sirleo-links.netlify.app',
        'Phone: +1 (773) 234-8238',
        'Email: sir.black.leo@gmail.com',
        'Text: +17732348238'
      ].join('\\n');

      const event1Lines = [
        'BEGIN:VEVENT',
        'UID:met-sirleo-' + Date.now() + '@sirleo-links.netlify.app',
        'DTSTART;VALUE=DATE:' + fmt(today),
        'DTEND;VALUE=DATE:' + fmt(tomorrow),
        'SUMMARY:Met Sir Leo',
        'DESCRIPTION:' + desc1,
        lat && lon ? 'GEO:' + lat.toFixed(6) + ';' + lon.toFixed(6) : null,
        'END:VEVENT'
      ].filter(Boolean).join('\r\n');

      const event2Lines = [
        'BEGIN:VEVENT',
        'UID:remind-sirleo-' + Date.now() + '@sirleo-links.netlify.app',
        'DTSTART;VALUE=DATE:' + fmt(reminder),
        'DTEND;VALUE=DATE:' + fmt(reminderEnd),
        'SUMMARY:Connect with Sir Leo',
        'DESCRIPTION:' + desc2,
        'END:VEVENT'
      ].join('\r\n');

      const ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Sir Leo//sirleo-links//EN\r\n' + event1Lines + '\r\n' + event2Lines + '\r\nEND:VCALENDAR';

      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'sir-leo.ics'; a.click();
      URL.revokeObjectURL(url);
      document.getElementById('manual').onclick = () => { a.click(); return false; };
    }

    const params = new URLSearchParams(location.search);
    const lat = parseFloat(params.get('lat'));
    const lon = parseFloat(params.get('lon'));

    if (!isNaN(lat) && !isNaN(lon)) {
      buildAndDownload(lat, lon);
    } else if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => buildAndDownload(pos.coords.latitude, pos.coords.longitude),
        ()  => buildAndDownload(null, null),
        { timeout: 5000 }
      );
    } else {
      buildAndDownload(null, null);
    }
  </script>
</body>
</html>
