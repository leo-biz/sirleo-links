<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sir Leo — Admin</title>
  <script src="/config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --black: #080808; --deep: #0c0c0c; --surface: #111111; --sidebar: #0a0a0a;
      --border: rgba(180,145,90,0.14); --border-hover: rgba(180,145,90,0.35);
      --gold: #c4a265; --gold-light: #d4af7a; --gold-dim: rgba(196,162,101,0.15);
      --crimson: #9b2020; --muted: rgba(240,232,216,0.4); --text: #e8dcc8;
      --sidebar-w: 220px; --radius: 3px;
    }
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Raleway:wght@200;300;400&display=swap');
    body { background: var(--black); color: var(--text); font-family: 'Raleway', sans-serif;
      font-weight: 300; min-height: 100vh; }

    /* ── Gate ─────────────────────────────────────────────────────────────── */
    #gate { display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 16px; }
    #gate h1 { font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: 0.2em; color: var(--gold); }
    #gate input { background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 12px 16px; font-family: inherit; font-size: 15px; width: 240px;
      text-align: center; outline: none; }
    #gate input:focus { border-color: var(--gold); }
    #gate button { background: none; border: 1px solid var(--gold); color: var(--gold);
      padding: 10px 32px; font-family: 'Cinzel', serif; font-size: 13px;
      letter-spacing: 0.15em; cursor: pointer; }
    #gate button:hover { background: rgba(180,145,90,0.08); }
    #gate-err { color: var(--crimson); font-size: 13px; display: none; }

    /* ── Shell ────────────────────────────────────────────────────────────── */
    #dash { display: none; min-height: 100vh; }
    .shell { display: flex; min-height: 100vh; }

    /* ── Sidebar ──────────────────────────────────────────────────────────── */
    .sidebar {
      width: var(--sidebar-w); background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
      box-shadow: 4px 0 24px rgba(0,0,0,0.4);
    }
    .sidebar-brand {
      padding: 28px 22px 22px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand-name {
      font-family: 'Cinzel', serif; font-size: 13px; letter-spacing: 0.22em; color: var(--gold);
    }
    .sidebar-brand-sub {
      font-size: 9px; color: var(--muted); letter-spacing: 0.12em; margin-top: 4px; text-transform: uppercase;
    }
    .sidebar-nav { flex: 1; padding: 12px 0; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 22px; font-size: 11px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--muted);
      cursor: pointer; transition: color 0.2s, background 0.2s;
      border-left: 2px solid transparent; margin: 1px 0;
    }
    .nav-item:hover { color: var(--text); background: rgba(180,145,90,0.05); }
    .nav-item.active { color: var(--gold); border-left-color: var(--gold);
      background: var(--gold-dim); }
    .nav-icon { font-size: 13px; width: 18px; text-align: center; opacity: 0.8; }
    .sidebar-footer {
      padding: 14px 22px; border-top: 1px solid var(--border);
      font-size: 9px; color: rgba(240,232,216,0.18); letter-spacing: 0.1em;
    }

    /* ── Main ─────────────────────────────────────────────────────────────── */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1; padding: 32px 28px 60px;
      min-width: 0;
    }
    .page { display: none; }
    .page.active { display: block; }

    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .page-title { font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: 0.18em; color: var(--gold); }
    .page-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
    .refresh-btn { background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 8px 18px; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.12em;
      cursor: pointer; border-radius: var(--radius); transition: border-color 0.2s, color 0.2s; text-transform: uppercase; }
    .refresh-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Stats ────────────────────────────────────────────────────────────── */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px; margin-bottom: 32px; }
    .stat { background: var(--surface); border: 1px solid var(--border); padding: 18px 16px;
      text-align: center; border-radius: var(--radius);
      border-top: 2px solid rgba(180,145,90,0.2); transition: border-color 0.2s; }
    .stat:hover { border-top-color: var(--gold); }
    .stat-num { font-family: 'Cinzel', serif; font-size: 30px; color: var(--gold);
      text-shadow: 0 0 20px rgba(196,162,101,0.25); }
    .stat-label { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; margin-top: 6px; text-transform: uppercase; }
    .stat.live .stat-num { color: #4caf7d; text-shadow: 0 0 20px rgba(76,175,125,0.3); }
    .stat.dim  .stat-num { color: var(--muted); font-size: 20px; text-shadow: none; }

    /* ── Section ──────────────────────────────────────────────────────────── */
    .section { margin-bottom: 28px; background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px; }
    .section-title { font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.22em;
      color: var(--gold); text-transform: uppercase; margin-bottom: 16px;
      padding-bottom: 10px; border-bottom: 1px solid var(--border); opacity: 0.85; }

    /* ── Table ────────────────────────────────────────────────────────────── */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th { text-align: left; color: var(--muted); font-weight: 400; font-size: 11px;
      letter-spacing: 0.08em; text-transform: uppercase; padding: 6px 8px;
      border-bottom: 1px solid var(--border); }
    .tbl td { padding: 8px 8px; border-bottom: 1px solid rgba(180,145,90,0.07); vertical-align: top; }
    .tbl tr:last-child td { border-bottom: none; }
    .tbl tr:hover td { background: rgba(180,145,90,0.04); }
    .badge { display: inline-block; padding: 3px 9px; font-size: 10px; border: 1px solid var(--border);
      color: var(--muted); border-radius: var(--radius); letter-spacing: 0.06em; }
    .badge.gold { border-color: rgba(196,162,101,0.4); color: var(--gold); background: rgba(196,162,101,0.06); }

    /* ── Bar chart ────────────────────────────────────────────────────────── */
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
    .bar-label { width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); flex-shrink: 0; }
    .bar-track { flex: 1; height: 6px; background: var(--surface); }
    .bar-fill { height: 100%; background: var(--gold); }
    .bar-count { width: 28px; text-align: right; color: var(--gold); font-size: 12px; }

    /* ── Line chart ──────────────────────────────────────────────────────── */
    .chart-wrap { position: relative; width: 100%; }
    .chart-wrap svg { width: 100%; display: block; }
    .chart-legend { display: flex; gap: 20px; margin-bottom: 12px; font-size: 11px; }
    .chart-legend-item { display: flex; align-items: center; gap: 6px; color: var(--muted); }
    .chart-legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .chart-range { display: flex; gap: 6px; margin-bottom: 16px; }
    .chart-range-btn { background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 12px; font-family: inherit; font-size: 11px; letter-spacing: 0.08em;
      cursor: pointer; text-transform: uppercase; }
    .chart-range-btn.active { border-color: var(--gold); color: var(--gold); }

    /* ── Grid ─────────────────────────────────────────────────────────────── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 24px; }
    @media (max-width: 700px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }

    /* ── Loading / error ──────────────────────────────────────────────────── */
    .loading { color: var(--muted); font-size: 13px; text-align: center; padding: 40px; }
    .error-msg { color: var(--crimson); font-size: 13px; text-align: center; padding: 40px; }

    /* ── Sessions ─────────────────────────────────────────────────────────── */
    .sess-load-btn { background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 10px 24px; font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.15em; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    .sess-load-btn:hover { border-color: var(--gold); color: var(--gold); }
    .sess-row { border-bottom: 1px solid rgba(180,145,90,0.07); cursor: pointer; }
    .sess-row:hover .sess-main { background: rgba(180,145,90,0.03); }
    .sess-main { display: grid; grid-template-columns: auto 1fr auto auto; gap: 12px;
      align-items: center; padding: 10px 8px; font-size: 13px; }
    .sess-live { display: inline-block; padding: 2px 7px; font-size: 9px; letter-spacing: 0.15em;
      background: rgba(76,175,125,0.15); border: 1px solid rgba(76,175,125,0.4); color: #4caf7d;
      text-transform: uppercase; font-family: 'Cinzel', serif; }
    .sess-name { font-weight: 400; }
    .sess-meta { font-size: 11px; color: var(--muted); }
    .sess-tag { display: inline-block; padding: 2px 7px; font-size: 10px;
      border: 1px solid var(--border); color: var(--muted); margin-right: 4px; }
    .sess-tag.gold { border-color: rgba(180,145,90,0.4); color: var(--gold); }
    .sess-chevron { color: var(--muted); font-size: 11px; transition: transform 0.2s; }
    .sess-row.open .sess-chevron { transform: rotate(90deg); }
    .sess-timeline { display: none; padding: 8px 8px 14px 24px;
      border-top: 1px solid rgba(255,255,255,0.04); }
    .sess-row.open .sess-timeline { display: block; }
    .tl-item { display: flex; gap: 12px; align-items: baseline; padding: 4px 0; font-size: 12px;
      border-left: 1px solid rgba(180,145,90,0.15); padding-left: 12px; margin-left: 4px; }
    .tl-time { color: rgba(240,232,216,0.3); font-size: 10px; white-space: nowrap; flex-shrink: 0; }
    .tl-ev { color: var(--text); }
    .tl-val { color: var(--gold); font-size: 11px; }

    /* ── Pipeline ─────────────────────────────────────────────────────────── */
    .pipeline { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
    @media (max-width: 900px) { .pipeline { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 520px)  { .pipeline { grid-template-columns: 1fr; } }
    .pipe-col-title { font-family:'Cinzel',serif; font-size:10px; letter-spacing:0.2em;
      color:var(--gold); text-transform:uppercase; margin-bottom:10px; padding-bottom:8px;
      border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .pipe-count { background:var(--surface); border:1px solid var(--border); color:var(--muted);
      width:20px; height:20px; display:flex; align-items:center; justify-content:center;
      font-size:11px; border-radius:50%; flex-shrink:0; }
    .pipe-card { background:var(--deep); border:1px solid var(--border); padding:14px;
      margin-bottom:8px; border-radius:var(--radius); transition:border-color 0.2s, box-shadow 0.2s; }
    .pipe-card:hover { border-color:var(--border-hover); box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .pipe-name { font-size:13px; font-weight:400; color:var(--text); margin-bottom:3px; }
    .pipe-interest { font-size:11px; color:var(--muted); margin-bottom:8px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .pipe-tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:10px; }
    .pipe-tag { font-size:10px; padding:2px 6px; border:1px solid var(--border); color:var(--muted); }
    .pipe-tag.gold  { border-color:rgba(180,145,90,0.4); color:var(--gold); }
    .pipe-tag.green { border-color:rgba(76,175,125,0.4); color:#4caf7d; }
    .pipe-tag.dim   { border-color:rgba(255,255,255,0.08); }
    .pipe-actions { display:flex; gap:4px; flex-wrap:wrap; }
    .pipe-btn { background:none; border:1px solid var(--border); color:var(--muted);
      padding:5px 8px; font-size:10px; font-family:'Cinzel',serif; letter-spacing:0.08em;
      cursor:pointer; transition:border-color 0.2s,color 0.2s; }
    .pipe-btn:hover { border-color:var(--gold); color:var(--gold); }
    .pipe-btn.primary { border-color:rgba(180,145,90,0.4); color:var(--gold); }
    .pipe-btn.danger  { border-color:rgba(155,32,32,0.35); color:rgba(192,57,43,0.7); }
    .pipe-next { font-size:10px; color:rgba(240,232,216,0.25); margin-top:6px; }

    /* ── Pipeline list view ──────────────────────────────────────────────── */
    .pipe-view-toggle { display: flex; gap: 6px; }
    .pipe-view-btn { background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 6px 14px; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.12em;
      cursor: pointer; text-transform: uppercase; transition: border-color 0.2s, color 0.2s; }
    .pipe-view-btn.active { border-color: var(--gold); color: var(--gold); }

    .pipe-list { display: flex; flex-direction: column; gap: 8px; }
    .pipe-stage { border: 1px solid var(--border); }
    .pipe-stage-header { display: flex; align-items: center; gap: 10px; padding: 12px 16px;
      cursor: pointer; user-select: none; transition: background 0.15s; }
    .pipe-stage-header:hover { background: rgba(180,145,90,0.04); }
    .pipe-stage-arrow { color: var(--muted); font-size: 11px; transition: transform 0.2s; flex-shrink: 0; }
    .pipe-stage.open .pipe-stage-arrow { transform: rotate(90deg); }
    .pipe-stage-name { font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.18em;
      color: var(--gold); text-transform: uppercase; flex: 1; }
    .pipe-stage-count { font-size: 11px; color: var(--muted); }
    .pipe-stage-body { display: none; border-top: 1px solid var(--border); }
    .pipe-stage.open .pipe-stage-body { display: block; }
    .pipe-list-row { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px;
      align-items: center; padding: 10px 16px; border-bottom: 1px solid rgba(180,145,90,0.06);
      cursor: pointer; transition: background 0.15s; font-size: 13px; }
    .pipe-list-row:last-child { border-bottom: none; }
    .pipe-list-row:hover { background: rgba(180,145,90,0.04); }
    .pipe-list-name { font-weight: 400; }
    .pipe-list-interest { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .pipe-list-next { font-size: 11px; color: rgba(240,232,216,0.3); white-space: nowrap; }

    /* ── Detail modal ─────────────────────────────────────────────────────── */
    .pipe-detail-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 100; }
    .pipe-detail-overlay.open { display: block; }
    .pipe-detail-panel { position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 100%;
      background: var(--deep); border-left: 1px solid var(--border);
      z-index: 101; overflow-y: auto; padding: 28px 24px 40px;
      transform: translateX(100%); transition: transform 0.25s ease; }
    .pipe-detail-panel.open { transform: translateX(0); }
    .pipe-detail-close { background: none; border: none; color: var(--muted); font-size: 20px;
      cursor: pointer; float: right; line-height: 1; padding: 0; }
    .pipe-detail-close:hover { color: var(--gold); }
    .pipe-detail-name { font-family: 'Cinzel', serif; font-size: 18px; color: var(--gold);
      letter-spacing: 0.12em; margin: 16px 0 4px; clear: both; }
    .pipe-detail-interest { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
    .pipe-detail-field { margin-bottom: 14px; }
    .pipe-detail-label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); font-family: 'Cinzel', serif; margin-bottom: 4px; }
    .pipe-detail-value { font-size: 13px; color: var(--text); }
    .pipe-detail-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .pipe-detail-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
    .pipe-detail-btn { background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 10px 16px; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 0.12em;
      cursor: pointer; text-align: left; transition: border-color 0.2s, color 0.2s; }
    .pipe-detail-btn:hover { border-color: var(--gold); color: var(--gold); }
    .pipe-detail-btn.primary { border-color: rgba(180,145,90,0.5); color: var(--gold); }
    .pipe-detail-btn.danger { border-color: rgba(155,32,32,0.35); color: rgba(192,57,43,0.8); }

    /* ── Messaging thread ─────────────────────────────────────────────────── */
    .msg-thread { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px;
      max-height: 220px; overflow-y: auto; padding-right: 4px; }
    .msg-bubble { max-width: 85%; padding: 8px 12px; font-size: 12px; line-height: 1.5;
      border-radius: 2px; }
    .msg-bubble.in  { background: var(--surface); border: 1px solid var(--border);
      align-self: flex-start; color: var(--text); }
    .msg-bubble.out { background: var(--gold-dim); border: 1px solid rgba(196,162,101,0.25);
      align-self: flex-end; color: var(--gold-light); }
    .msg-meta { font-size: 9px; color: var(--muted); margin-top: 3px; opacity: 0.6; }
    .msg-compose { display: flex; gap: 8px; margin-top: 8px; }
    .msg-input { flex: 1; background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 9px 12px; font-family: inherit; font-size: 12px;
      outline: none; resize: none; border-radius: var(--radius); }
    .msg-input:focus { border-color: var(--gold); }
    .msg-send-btn { background: none; border: 1px solid rgba(180,145,90,0.4); color: var(--gold);
      padding: 9px 14px; font-family: 'Cinzel', serif; font-size: 10px; letter-spacing: 0.1em;
      cursor: pointer; border-radius: var(--radius); white-space: nowrap; }
    .msg-send-btn:hover { background: var(--gold-dim); }

    /* ── QR ───────────────────────────────────────────────────────────────── */
    .qr-body { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
    @media (max-width: 560px) { .qr-body { grid-template-columns: 1fr; } }
    .qr-fields { display: flex; flex-direction: column; gap: 10px; }
    .qr-field { display: flex; flex-direction: column; gap: 5px; }
    .qr-field label { font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
      color: var(--muted); font-family: 'Cinzel', serif; }
    .qr-field input { background: var(--surface); border: 1px solid var(--border);
      color: var(--text); padding: 10px 14px; font-family: inherit; font-size: 13px;
      outline: none; transition: border-color 0.2s; }
    .qr-field input:focus { border-color: var(--gold); }
    .qr-url-preview { font-size: 11px; color: rgba(180,145,90,0.6); word-break: break-all; margin-top: 2px; }
    .qr-actions { display: flex; gap: 8px; margin-top: 6px; }
    .qr-btn { flex: 1; background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 9px 14px; font-family: 'Cinzel', serif; font-size: 11px;
      letter-spacing: 0.12em; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    .qr-btn:hover { border-color: var(--gold); color: var(--gold); }
    .qr-btn.primary { border-color: rgba(180,145,90,0.5); color: var(--gold); }
    .qr-btn.primary:hover { background: rgba(180,145,90,0.08); }
    .qr-preview-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    #qr-canvas-wrap { background: var(--surface); border: 1px solid var(--border); padding: 16px; }
    #qr-canvas-wrap canvas { display: block; }
    .qr-size-row { display: flex; gap: 6px; }
    .qr-size-btn { background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 5px 10px; font-size: 11px; cursor: pointer; font-family: inherit;
      transition: border-color 0.2s, color 0.2s; }
    .qr-size-btn.active, .qr-size-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* ── Mobile sidebar toggle ────────────────────────────────────────────── */
    .menu-toggle { display: none; position: fixed; top: 14px; left: 14px; z-index: 20;
      background: var(--surface); border: 1px solid var(--border); color: var(--gold);
      padding: 8px 12px; font-size: 16px; cursor: pointer; line-height: 1; }
    @media (max-width: 640px) {
      .menu-toggle { display: block; }
      .sidebar { transform: translateX(-100%); transition: transform 0.2s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; padding-top: 56px; }
    }
  </style>
</head>
<body>

  <!-- Password gate -->
  <div id="gate">
    <h1>SIR LEO</h1>
    <div style="color:var(--muted);font-size:12px;letter-spacing:0.1em;">ADMIN ACCESS</div>
    <input type="password" id="pw-input" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()" />
    <button onclick="checkPw()">Enter</button>
    <div id="gate-err">Incorrect password</div>
  </div>

  <!-- Dashboard -->
  <div id="dash">
    <button class="menu-toggle" onclick="toggleSidebar()">☰</button>

    <div class="shell">
      <!-- Sidebar -->
      <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="sidebar-brand-name">SIR LEO</div>
          <div class="sidebar-brand-sub">Admin <span id="dash-version"></span></div>
        </div>

                <button class="qr-size-btn" onclick="qrSetSize(160)" data-size="160">S</button>
                <button class="qr-size-btn active" onclick="qrSetSize(240)" data-size="240">M</button>
                <button class="qr-size-btn" onclick="qrSetSize(340)" data-size="340">L</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // ── Auth ────────────────────────────────────────────────────────────────────
  const PASS_KEY      = 'sl_admin_auth';
  const HASH_CACHE_KEY = 'sl_admin_hash';
  const HASH_TTL_MS   = 24 * 60 * 60 * 1000; // 24 hours
  let _passHash = null;

  // Load hash from localStorage first (instant), then refresh from sheet in background
  function _loadHash() {
    const cached = _readCache(HASH_CACHE_KEY);
    if (cached) _passHash = cached;
    // always refresh in background so a changed password takes effect within 24h
    fetchWithTimeout(SL.sheetUrl + '?action=config')
      .then(r => r.json())
      .then(cfg => {
        if (cfg.adminPassHash) {
          _passHash = cfg.adminPassHash;
          _writeCache(HASH_CACHE_KEY, cfg.adminPassHash, HASH_TTL_MS);
        }
      })
      .catch(() => {});
  }
  _loadHash();

  async function checkPw() {
    if (!_passHash) {
      showErr('Config loading — try again in a moment', 3000);
      return;
    }
    const val = document.getElementById('pw-input').value;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(val));
    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    if (hex === _passHash) {
      sessionStorage.setItem(PASS_KEY, '1');
      showDash();
    } else {
      showErr('Incorrect password', 2000);
    }
  }

  function showErr(msg, ms) {
    const err = document.getElementById('gate-err');
    err.textContent = msg;
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', ms);
  }

  function showDash() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dash').style.display  = 'block';
    document.getElementById('dash-version').textContent = SL.version ? 'v' + SL.version : '';
    loadOverview();
    qrInit();
  }

  // moved to end of script — must run after all let declarations

  // ── Cache helpers ────────────────────────────────────────────────────────────
  function _writeCache(key, data, ttlMs) {
    try { localStorage.setItem(key, JSON.stringify({ data, exp: Date.now() + ttlMs })); } catch(e) {}
  }

  function _readCache(key) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return null;
      const { data, exp } = JSON.parse(raw);
      return Date.now() < exp ? data : null;
    } catch(e) { return null; }
  }

  // ── Fetch with timeout ───────────────────────────────────────────────────────
  function fetchWithTimeout(url, ms = 12000) {
    const ctrl = new AbortController();
    const tid  = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(tid));
  }

  // ── Stale-while-revalidate ───────────────────────────────────────────────────
  // Shows cached data immediately, fetches fresh in background, re-renders on arrival
  function swr(cacheKey, ttlMs, url, renderFn, loadingEl, errorMsg) {
    const cached = _readCache(cacheKey);
    if (cached) {
      renderFn(cached);
    } else {
      document.getElementById(loadingEl).innerHTML = '<div class="loading">Loading…</div>';
    }
    fetchWithTimeout(SL.sheetUrl + url)
      .then(r => r.json())
      .then(data => {
        _writeCache(cacheKey, data, ttlMs);
        renderFn(data);
      })
      .catch(() => {
        if (!cached) document.getElementById(loadingEl).innerHTML = `<div class="error-msg">${errorMsg}</div>`;
      });
  }

  // ── Nav ─────────────────────────────────────────────────────────────────────
  let _currentPage = 'overview';
  const _loaded = {};

  function navTo(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    document.querySelector('[data-page="' + page + '"]').classList.add('active');
    _currentPage = page;
    // close mobile sidebar
    document.getElementById('sidebar').classList.remove('open');
    // lazy load on first visit
    if (!_loaded[page]) {
      _loaded[page] = true;
      if (page === 'pipeline') loadPipeline();
      if (page === 'sessions') loadSessions();
    }
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
  }

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function fmt(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleDateString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch { return iso; }
  }

  function fmtShort(iso) {
    if (!iso) return '—';
    try { return new Date(iso).toLocaleString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
    catch { return iso; }
  }

  function bar(items, maxVal) {
    return items.map(([label, count]) =>
      `<div class="bar-row">
        <div class="bar-label" title="${label}">${label || '(direct)'}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(count/maxVal*100)}%"></div></div>
        <div class="bar-count">${count}</div>
      </div>`
    ).join('');
  }

  const none = '<div style="color:var(--muted);font-size:13px;padding:8px 0">No data yet</div>';

  // ── Line chart ───────────────────────────────────────────────────────────────
  let _tsData = null;
  let _tsDays = 30;

  function renderLineChart(ts, days) {
    _tsData = ts; _tsDays = days;
    const labels   = ts.labels.slice(-days);
    const visits   = (ts.visits   || []).slice(-days);
    const sessions = ts.sessions.slice(-days);
    const contacts = ts.contacts.slice(-days);

    const W = 800, H = 180, padL = 28, padR = 12, padT = 12, padB = 28;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    const maxVal = Math.max(1, ...visits, ...sessions, ...contacts);
    const step   = innerW / Math.max(labels.length - 1, 1);

    const xp = i => padL + i * step;
    const yp = v => padT + innerH - (v / maxVal) * innerH;

    const polyline = (data, color, fill) => {
      const pts = data.map((v, i) => `${xp(i).toFixed(1)},${yp(v).toFixed(1)}`).join(' ');
      const areaPath = `M${xp(0).toFixed(1)},${(padT+innerH).toFixed(1)} ` +
        data.map((v, i) => `L${xp(i).toFixed(1)},${yp(v).toFixed(1)}`).join(' ') +
        ` L${xp(data.length-1).toFixed(1)},${(padT+innerH).toFixed(1)} Z`;
      return `
        <path d="${areaPath}" fill="${fill}" />
        <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
        ${data.map((v,i) => v > 0 ? `<circle cx="${xp(i).toFixed(1)}" cy="${yp(v).toFixed(1)}" r="3" fill="${color}"/>` : '').join('')}`;
    };

    // X-axis labels — show ~5 evenly spaced
    const interval = Math.ceil(labels.length / 5);
    const xLabels = labels.map((lbl, i) => {
      if (i % interval !== 0 && i !== labels.length - 1) return '';
      const d = new Date(lbl);
      const txt = (d.getMonth()+1) + '/' + d.getDate();
      return `<text x="${xp(i).toFixed(1)}" y="${H - 4}" text-anchor="middle" fill="rgba(240,232,216,0.3)" font-size="9">${txt}</text>`;
    }).join('');

    // Y-axis labels
    const yLabels = [0, Math.round(maxVal/2), maxVal].map(v =>
      `<text x="${padL - 4}" y="${yp(v).toFixed(1)}" text-anchor="end" dominant-baseline="middle" fill="rgba(240,232,216,0.3)" font-size="9">${v}</text>`
    ).join('');

    // Grid lines
    const gridLines = [0, 0.25, 0.5, 0.75, 1].map(pct =>
      `<line x1="${padL}" x2="${W - padR}" y1="${(padT + innerH * (1-pct)).toFixed(1)}" y2="${(padT + innerH * (1-pct)).toFixed(1)}" stroke="rgba(180,145,90,0.08)" stroke-width="1"/>`
    ).join('');

    const svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
      ${gridLines}
      ${visits.length   ? polyline(visits,   'rgba(240,232,216,0.3)', 'rgba(240,232,216,0.04)') : ''}
      ${polyline(sessions, '#c4a265', 'rgba(196,162,101,0.08)')}
      ${polyline(contacts, '#4caf7d', 'rgba(76,175,125,0.08)')}
      ${xLabels}${yLabels}
    </svg>`;

    const el = document.getElementById('line-chart');
    if (el) el.innerHTML = svg;

    // Highlight active range btn
    document.querySelectorAll('.chart-range-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.days) === days);
    });
  }

  function setChartRange(days) {
    if (_tsData) renderLineChart(_tsData, days);
  }

  // ── Overview ─────────────────────────────────────────────────────────────────
  function loadOverview() {
    swr('sl_cache_overview', 5 * 60 * 1000, '?action=summary',
      renderOverview, 'overview-body',
      'Could not load data. Make sure the Apps Script GET handler is deployed.');
  }

  function renderOverview(d) {
    const now = new Date().toLocaleTimeString();
    document.getElementById('overview-updated').textContent = 'Updated ' + now;
    document.getElementById('sidebar-updated').textContent  = 'Updated ' + now;

    const topSrc    = Object.entries(d.sources       || {}).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const topRef    = Object.entries(d.refs          || {}).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const topEvents = Object.entries(d.topEvents     || {}).sort((a,b)=>b[1]-a[1]).slice(0,10);
    const devices   = Object.entries(d.deviceCounts  || {}).sort((a,b)=>b[1]-a[1]);
    const oses      = Object.entries(d.osCounts      || {}).sort((a,b)=>b[1]-a[1]);
    const browsers  = Object.entries(d.browserCounts || {}).sort((a,b)=>b[1]-a[1]);
    const countries = Object.entries(d.countryCounts || {}).sort((a,b)=>b[1]-a[1]).slice(0,8);
    const cities    = Object.entries(d.cityCounts    || {}).sort((a,b)=>b[1]-a[1]).slice(0,8);

    const convRate = d.totalSessions
      ? Math.round((d.totalContacts / d.totalSessions) * 100) + '%' : '—';

    const recentContacts = (d.contacts || []).slice(0,15).map(c =>
      `<tr>
        <td>${c.name||'—'}</td><td>${c.phone||'—'}</td>
        <td><span class="badge gold">${c.interest||'—'}</span></td>
        <td style="color:var(--muted)">${fmt(c.timestamp)}</td>
      </tr>`).join('');

    const recentEvents = (d.recentEvents || []).slice(0,20).map(e =>
      `<tr>
        <td style="color:var(--muted)">${fmt(e.timestamp)}</td>
        <td style="color:var(--muted);font-size:11px">${(e.sessionId||'').slice(0,12)}</td>
        <td>${e.name||'—'}</td>
        <td style="color:var(--muted)">${e.ip||'—'}</td>
        <td>${e.device||'—'}</td>
        <td>${e.os||'—'}</td>
        <td>${e.browser||'—'}</td>
        <td>${e.event||'—'}</td>
        <td style="color:var(--muted)">${e.value||''}</td>
      </tr>`).join('');

    document.getElementById('overview-body').innerHTML = `
      <div class="stats">
        <div class="stat"><div class="stat-num">${d.totalVisits??'—'}</div><div class="stat-label">Visits</div></div>
        <div class="stat dim"><div class="stat-num">${d.totalSessions??'—'}</div><div class="stat-label">Sessions</div></div>
        <div class="stat live"><div class="stat-num">${d.activeSessions??'—'}</div><div class="stat-label">Active Now</div></div>
        <div class="stat dim"><div class="stat-num">${d.returnVisitors??'—'}</div><div class="stat-label">Return</div></div>
        <div class="stat"><div class="stat-num">${d.totalContacts??'—'}</div><div class="stat-label">Contacts</div></div>
        <div class="stat"><div class="stat-num">${d.bookCompleted??'—'}</div><div class="stat-label">Books</div></div>
        <div class="stat dim"><div class="stat-num">${convRate}</div><div class="stat-label">Conv. Rate</div></div>
      </div>

      <div class="section">
        <div class="section-title">Traffic Over Time</div>
        <div class="chart-legend">
          <div class="chart-legend-item"><div class="chart-legend-dot" style="background:rgba(240,232,216,0.4)"></div>Visits</div>
          <div class="chart-legend-item"><div class="chart-legend-dot" style="background:#c4a265"></div>Sessions</div>
          <div class="chart-legend-item"><div class="chart-legend-dot" style="background:#4caf7d"></div>Contacts</div>
        </div>
        <div class="chart-range">
          <button class="chart-range-btn" data-days="7"  onclick="setChartRange(7)">7d</button>
          <button class="chart-range-btn" data-days="14" onclick="setChartRange(14)">14d</button>
          <button class="chart-range-btn active" data-days="30" onclick="setChartRange(30)">30d</button>
        </div>
        <div class="chart-wrap" id="line-chart"></div>
      </div>

      <div class="grid-2">
        <div class="section"><div class="section-title">Sources</div>${topSrc.length ? bar(topSrc, topSrc[0][1]) : none}</div>
        <div class="section"><div class="section-title">Referrals</div>${topRef.length ? bar(topRef, topRef[0][1]) : none}</div>
      </div>

      <div class="section"><div class="section-title">Top Actions</div>${topEvents.length ? bar(topEvents, topEvents[0][1]) : none}</div>

      <div class="grid-3">
        <div class="section"><div class="section-title">Device</div>${devices.length ? bar(devices, devices[0][1]) : none}</div>
        <div class="section"><div class="section-title">OS</div>${oses.length ? bar(oses, oses[0][1]) : none}</div>
        <div class="section"><div class="section-title">Browser</div>${browsers.length ? bar(browsers, browsers[0][1]) : none}</div>
      </div>

      <div class="grid-2">
        <div class="section"><div class="section-title">Country</div>${countries.length ? bar(countries, countries[0][1]) : none}</div>
        <div class="section"><div class="section-title">City / State</div>${cities.length ? bar(cities, cities[0][1]) : none}</div>
      </div>

      <div class="section">
        <div class="section-title">Recent Contacts</div>
        ${recentContacts
          ? `<table class="tbl"><thead><tr><th>Name</th><th>Phone</th><th>Interest</th><th>When</th></tr></thead><tbody>${recentContacts}</tbody></table>`
          : none}
      </div>

      <div class="section">
        <div class="section-title">Event Log</div>
        ${recentEvents
          ? `<table class="tbl"><thead><tr><th>When</th><th>Session</th><th>Name</th><th>IP</th><th>Device</th><th>OS</th><th>Browser</th><th>Event</th><th>Value</th></tr></thead><tbody>${recentEvents}</tbody></table>`
          : none}
      </div>
    `;

    if (d.timeSeries) renderLineChart(d.timeSeries, _tsDays);
  }

  // ── Sessions ─────────────────────────────────────────────────────────────────
  function loadSessions() {
    swr('sl_cache_sessions', 2 * 60 * 1000, '?action=sessions&limit=40',
      renderSessions, 'sess-body', 'Could not load sessions.');
  }

  function renderSessions(sessions) {
    if (!sessions.length) {
      document.getElementById('sess-body').innerHTML =
        '<div style="color:var(--muted);font-size:13px;padding:8px 0">No sessions yet</div>';
      return;
    }
    document.getElementById('sess-body').innerHTML = sessions.map((s, i) => {
      const label    = s.name || '<span style="color:var(--muted)">Anonymous</span>';
      const loc      = [s.city, s.region, s.country].filter(Boolean).join(', ') || '—';
      const src      = s.source ? `<span class="sess-tag">${s.source}</span>` : '';
      const ref      = s.ref    ? `<span class="sess-tag gold">${s.ref}</span>` : '';
      const live     = s.active ? '<span class="sess-live">Live</span> ' : '';
      const evCount  = s.events ? s.events.length : 0;
      const timeline = (s.events || []).map(e => {
        const val = e.value ? `<span class="tl-val">${e.value}</span>` : '';
        return `<div class="tl-item"><span class="tl-time">${fmtShort(e.timestamp)}</span><span class="tl-ev">${e.event}</span>${val}</div>`;
      }).join('');

      return `
        <div class="sess-row" id="sr-${i}" onclick="toggleSessRow(${i})">
          <div class="sess-main">
            <div>${live}<span class="sess-name">${label}</span>${s.phone ? ' <span class="badge gold">✓</span>' : ''}</div>
            <div class="sess-meta">${loc} &nbsp;·&nbsp; ${s.device||'?'} &nbsp;·&nbsp; ${src}${ref}</div>
            <div class="sess-meta" style="text-align:right">${evCount} events<br>${fmtShort(s.lastSeen||s.timestamp)}</div>
            <div class="sess-chevron">→</div>
          </div>
          <div class="sess-timeline">${timeline || '<span style="color:var(--muted);font-size:12px">No events</span>'}</div>
        </div>`;
    }).join('');
  }

  function toggleSessRow(i) {
    document.getElementById('sr-' + i).classList.toggle('open');
  }

  // ── Pipeline ─────────────────────────────────────────────────────────────────
  const PIPE_PHASES = {
    1: { title: 'Get to Call',  next: 'markConsulted', nextLabel: '✓ Consulted' },
    2: { title: 'Get Booked',   next: 'markBooked',    nextLabel: '✓ Booked' },
    3: { title: 'Pre-Session',  next: 'markSession',   nextLabel: '✓ Session Done' },
    4: { title: 'Post-Session', next: 'markComplete',  nextLabel: '✓ Complete' }
  };

  let _pipeView = 'kanban';
  let _pipeRows = [];
  let _pipeColsOpen = { 1: true, 2: true, 3: true, 4: true };

  function setPipeView(view) {
    _pipeView = view;
    document.getElementById('btn-kanban').classList.toggle('active', view === 'kanban');
    document.getElementById('btn-list').classList.toggle('active', view === 'list');
    if (_pipeRows.length) {
      view === 'kanban' ? renderKanban(_pipeRows) : renderList(_pipeRows);
    }
  }

  function loadPipeline() {
    swr('sl_cache_pipeline', 2 * 60 * 1000, '?action=pipeline',
      renderPipeline, 'pipeline-body', 'Could not load pipeline.');
  }

  function renderPipeline(rows) {
    _pipeRows = (rows || []).filter(r => r.status !== 'complete');
    _pipeView === 'list' ? renderList(_pipeRows) : renderKanban(_pipeRows);
  }

  function _buildCols(rows) {
    const cols = { 1:[], 2:[], 3:[], 4:[] };
    rows.forEach(r => { const p = parseInt(r.phase)||1; if (cols[p]) cols[p].push(r); });
    return cols;
  }

  function _statusTag(r) {
    return r.status === 'waiting' ? '<span class="pipe-tag dim">Waiting</span>'
         : r.status === 'paused'  ? '<span class="pipe-tag dim">Paused</span>'
         : '<span class="pipe-tag green">Active</span>';
  }

  // ── Kanban view ───────────────────────────────────────────────────────────────
  function renderKanban(rows) {
    const cols = _buildCols(rows);
    const html = Object.entries(PIPE_PHASES).map(([phase, cfg]) => {
      const items = cols[phase] || [];
      const cards = items.map(r => {
        const srcTag  = r.source ? `<span class="pipe-tag gold">${r.source}</span>` : '';
        const nextStr = r.nextDate ? 'Next: ' + fmtShort(r.nextDate) : '';
        const pauseBtn = r.status === 'paused'
          ? `<button class="pipe-btn" onclick="pipeAction('resumeSeq','${r.id}')">Resume</button>`
          : `<button class="pipe-btn" onclick="pipeAction('pauseSeq','${r.id}')">Pause</button>`;
        return `<div class="pipe-card" onclick="openPipeDetail('${r.id}')" style="cursor:pointer">
          <div class="pipe-name">${r.name || 'Unknown'}</div>
          <div class="pipe-interest">${r.interest || '—'}</div>
          <div class="pipe-tags">${_statusTag(r)}${srcTag}</div>
          <div class="pipe-actions" onclick="event.stopPropagation()">
            <button class="pipe-btn primary" onclick="pipeAction('${cfg.next}','${r.id}')">${cfg.nextLabel}</button>
            ${pauseBtn}
            <button class="pipe-btn danger" onclick="pipeAction('markComplete','${r.id}')">✕</button>
          </div>
          ${nextStr ? `<div class="pipe-next">${nextStr}</div>` : ''}
        </div>`;
      }).join('') || '<div style="color:var(--muted);font-size:12px;padding:8px 0">Empty</div>';
      return `<div class="pipe-col">
        <div class="pipe-col-title">${cfg.title}<span class="pipe-count">${items.length}</span></div>
        ${cards}
      </div>`;
    }).join('');
    document.getElementById('pipeline-body').innerHTML = `<div class="pipeline">${html}</div>`;
  }

  // ── List view ─────────────────────────────────────────────────────────────────
  function renderList(rows) {
    const cols = _buildCols(rows);
    const html = Object.entries(PIPE_PHASES).map(([phase, cfg]) => {
      const items = cols[phase] || [];
      const isOpen = _pipeColsOpen[phase] !== false;
      const rowsHtml = items.map(r => {
        const nextStr = r.nextDate ? fmtShort(r.nextDate) : '—';
        return `<div class="pipe-list-row" onclick="openPipeDetail('${r.id}')">
          <div>
            <div class="pipe-list-name">${r.name || 'Unknown'}</div>
            <div class="pipe-list-interest">${r.interest || '—'}</div>
          </div>
          <div>${_statusTag(r)}</div>
          <div class="pipe-list-next">${nextStr}</div>
          <div style="color:var(--muted);font-size:14px">›</div>
        </div>`;
      }).join('') || `<div style="color:var(--muted);font-size:12px;padding:12px 16px">Empty</div>`;
      return `<div class="pipe-stage${isOpen ? ' open' : ''}" id="pipe-stage-${phase}">
        <div class="pipe-stage-header" onclick="togglePipeStage(${phase})">
          <span class="pipe-stage-arrow">›</span>
          <span class="pipe-stage-name">${cfg.title}</span>
          <span class="pipe-stage-count">${items.length}</span>
        </div>
        <div class="pipe-stage-body">${rowsHtml}</div>
      </div>`;
    }).join('');
    document.getElementById('pipeline-body').innerHTML = `<div class="pipe-list">${html}</div>`;
  }

  function togglePipeStage(phase) {
    const el = document.getElementById('pipe-stage-' + phase);
    const isOpen = el.classList.toggle('open');
    _pipeColsOpen[phase] = isOpen;
  }

  // ── Detail modal ──────────────────────────────────────────────────────────────
  let _detailPhone = '';

  function openPipeDetail(id) {
    const r = _pipeRows.find(x => x.id === id);
    if (!r) return;
    _detailPhone = r.phone || '';
    const cfg = PIPE_PHASES[parseInt(r.phase)] || {};
    const pauseBtn = r.status === 'paused'
      ? `<button class="pipe-detail-btn" onclick="pipeDetailAction('resumeSeq','${r.id}')">Resume Sequence</button>`
      : `<button class="pipe-detail-btn" onclick="pipeDetailAction('pauseSeq','${r.id}')">Pause Sequence</button>`;
    const field = (label, val) => val
      ? `<div class="pipe-detail-field"><div class="pipe-detail-label">${label}</div><div class="pipe-detail-value">${val}</div></div>`
      : '';
    document.getElementById('pipe-detail-content').innerHTML = `
      <div class="pipe-detail-name">${r.name || 'Unknown'}</div>
      <div class="pipe-detail-interest">${r.interest || '—'}</div>
      ${field('Phase', cfg.title)}
      ${field('Status', r.status)}
      ${field('Phone', r.phone ? `<a href="tel:${r.phone}" style="color:var(--gold)">${r.phone}</a>` : '')}
      ${field('Email', r.email ? `<a href="mailto:${r.email}" style="color:var(--gold)">${r.email}</a>` : '')}
      ${field('Source', r.source)}
      ${field('Enrolled', r.enrolled ? fmtShort(r.enrolled) : '')}
      ${field('Next Step', r.nextDate ? fmtShort(r.nextDate) : '')}
      ${field('Consult Date', r.consultDate ? fmtShort(r.consultDate) : '')}
      ${field('Book Date', r.bookDate ? fmtShort(r.bookDate) : '')}
      ${field('Session Date', r.sessionDate ? fmtShort(r.sessionDate) : '')}
      <hr class="pipe-detail-divider"/>
      <div class="section-title" style="margin-bottom:10px">Messages</div>
      <div class="msg-thread" id="msg-thread"><div style="color:var(--muted);font-size:12px">Loading…</div></div>
      <div class="msg-compose">
        <textarea class="msg-input" id="msg-input" rows="2" placeholder="Type a message…"></textarea>
        <button class="msg-send-btn" onclick="sendDetailText()">Send</button>
      </div>
      <hr class="pipe-detail-divider"/>
      <div class="pipe-detail-actions">
        ${cfg.next ? `<button class="pipe-detail-btn primary" onclick="pipeDetailAction('${cfg.next}','${r.id}')">${cfg.nextLabel}</button>` : ''}
        ${pauseBtn}
        <button class="pipe-detail-btn danger" onclick="pipeDetailAction('markComplete','${r.id}')">Mark Complete</button>
      </div>`;
    document.getElementById('pipe-detail-overlay').classList.add('open');
    document.getElementById('pipe-detail-panel').classList.add('open');
    if (_detailPhone) loadDetailMessages(_detailPhone);
  }

  function loadDetailMessages(phone) {
    fetch(SL.sheetUrl + '?action=messages&phone=' + encodeURIComponent(phone))
      .then(r => r.json())
      .then(msgs => {
        const thread = document.getElementById('msg-thread');
        if (!thread) return;
        if (!msgs || !msgs.length) {
          thread.innerHTML = '<div style="color:var(--muted);font-size:12px">No messages yet</div>';
          return;
        }
        thread.innerHTML = msgs.map(m =>
          `<div>
            <div class="msg-bubble ${m.direction}">${m.body}</div>
            <div class="msg-meta" style="text-align:${m.direction==='out'?'right':'left'}">${fmtShort(m.timestamp)}</div>
          </div>`
        ).join('');
        thread.scrollTop = thread.scrollHeight;
      })
      .catch(() => {
        const thread = document.getElementById('msg-thread');
        if (thread) thread.innerHTML = '<div style="color:var(--muted);font-size:12px">Could not load messages</div>';
      });
  }

  function sendDetailText() {
    const input = document.getElementById('msg-input');
    const body  = input ? input.value.trim() : '';
    if (!body || !_detailPhone) return;
    input.value = '';
    input.disabled = true;
    fetch(SL.sheetUrl, {
      method: 'POST',
      body: JSON.stringify({ type: 'replyText', phone: _detailPhone, body })
    })
    .then(r => r.json())
    .then(res => {
      input.disabled = false;
      if (res.ok) loadDetailMessages(_detailPhone);
      else alert('Send failed: ' + (res.error || 'unknown'));
    })
    .catch(() => { input.disabled = false; alert('Send failed'); });
  }

  function closePipeDetail() {
    document.getElementById('pipe-detail-overlay').classList.remove('open');
    document.getElementById('pipe-detail-panel').classList.remove('open');
  }

  function pipeDetailAction(action, id) {
    closePipeDetail();
    pipeAction(action, id);
  }

  function pipeAction(action, id) {
    fetchWithTimeout(SL.sheetUrl + '?action=' + action + '&id=' + encodeURIComponent(id))
      .then(r => r.json())
      .then(res => {
        localStorage.removeItem('sl_cache_pipeline');
        if (res.ok) loadPipeline(); else alert('Error: ' + (res.error||'unknown'));
      })
      .catch(() => alert('Request failed'));
  }

  // ── QR Generator ─────────────────────────────────────────────────────────────
  let _qr = null, _qrSize = 240;

  function qrInit() {
    document.getElementById('qr-base').value = SL.siteUrl || window.location.origin;
    qrUpdate();
  }

  function qrBuildUrl() {
    const base   = document.getElementById('qr-base').value.trim();
    const src    = document.getElementById('qr-src').value.trim();
    const ref    = document.getElementById('qr-ref').value.trim();
    const name   = document.getElementById('qr-name').value.trim();
    const params = [];
    if (src)  params.push('src='  + encodeURIComponent(src));
    if (ref)  params.push('ref='  + encodeURIComponent(ref));
    if (name) params.push('name=' + encodeURIComponent(name));
    return params.length ? base + '?' + params.join('&') : base;
  }

  function qrUpdate() {
    const url  = qrBuildUrl();
    document.getElementById('qr-url-preview').textContent = url;
    const wrap = document.getElementById('qr-canvas-wrap');
    wrap.innerHTML = '';
    _qr = new QRCode(wrap, {
      text: url, width: _qrSize, height: _qrSize,
      colorDark: '#f5ede0', colorLight: '#141414',
      correctLevel: QRCode.CorrectLevel.M
    });
  }

  function qrSetSize(size) {
    _qrSize = size;
    document.querySelectorAll('.qr-size-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.size) === size);
    });
    qrUpdate();
  }

  function qrDownload() {
    const canvas = document.querySelector('#qr-canvas-wrap canvas');
    if (!canvas) return;
    const src  = document.getElementById('qr-src').value.trim();
    const ref  = document.getElementById('qr-ref').value.trim();
    const name = ['sirleo-qr', src, ref].filter(Boolean).join('-') + '.png';
    const a    = document.createElement('a');
    a.download = name; a.href = canvas.toDataURL('image/png'); a.click();
  }

  function qrCopy() {
    navigator.clipboard.writeText(qrBuildUrl()).then(() => {
      const btn  = document.querySelector('.qr-actions .qr-btn:last-child');
      const orig = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => btn.textContent = orig, 1500);
    });
  }

  // Auto-login if session is still valid — runs last so all let declarations exist
  if (sessionStorage.getItem(PASS_KEY)) showDash();
</script>
</body>
</html>
